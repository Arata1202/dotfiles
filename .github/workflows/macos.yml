name: macOS
on:
  push:
    branches: master
  pull_request:
jobs:
  links:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify first install, repeated install, and conflict handling
        shell: bash
        run: |
          set -eu
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"
          echo existing > "$HOME/.zshrc"
          if make link; then exit 1; fi
          test "$(cat "$HOME/.zshrc")" = existing
          test ! -L "$HOME/.gitconfig_shared"
          mv "$HOME/.zshrc" "$HOME/.zshrc.original"
          echo existing > "$HOME/.config"
          if make link; then exit 1; fi
          test "$(cat "$HOME/.config")" = existing
          test ! -L "$HOME/.gitconfig_shared"
          mv "$HOME/.config" "$HOME/.config.original"
          mkdir -p "$XDG_CONFIG_HOME"
          echo existing > "$XDG_CONFIG_HOME/git"
          if make link; then exit 1; fi
          test "$(cat "$XDG_CONFIG_HOME/git")" = existing
          test ! -L "$HOME/.gitconfig_shared"
          mv "$XDG_CONFIG_HOME/git" "$HOME/git.original"
          mkdir -p "$XDG_CONFIG_HOME/git"
          lock="$XDG_CONFIG_HOME/git/config.lock"
          echo existing > "$lock"
          if make link > "$HOME/link.log" 2>&1; then exit 1; fi
          grep -F "Git config is locked: $(cd "$XDG_CONFIG_HOME/git" && pwd -P)/config.lock" "$HOME/link.log"
          test "$(cat "$lock")" = existing
          test ! -L "$HOME/.gitconfig_shared"
          mv "$lock" "$HOME/config.lock.original"
          printf '\357\273\277machine-only.tmp\n!.envrc\n' > "$XDG_CONFIG_HOME/git/ignore"
          printf '\357\273\277[user]\n\tname = Existing User\n' > "$XDG_CONFIG_HOME/git/config"
          git config --global core.editor nano
          git config --global --add include.path '~/.gitconfig_shared'
          keybindings="$HOME/Library/Application Support/Code/User/keybindings.json"
          mkdir -p "$(dirname "$keybindings")"
          ln -s "$PWD/vscode/keybindings.json" "$keybindings"
          make link
          git init -q "$HOME/check-ignore"
          git -C "$HOME/check-ignore" check-ignore --no-index machine-only.tmp
          git -C "$HOME/check-ignore" check-ignore --no-index example~
          if git -C "$HOME/check-ignore" check-ignore --no-index -q .envrc; then exit 1; fi
          cp "$XDG_CONFIG_HOME/git/ignore" "$HOME/ignore.first"
          test ! -L "$keybindings"
          cmp vscode/keybindings.json "$keybindings"
          echo '[]' > "$keybindings"
          make link
          cmp "$HOME/ignore.first" "$XDG_CONFIG_HOME/git/ignore"
          test "$(cat "$keybindings")" = '[]'
          test "$HOME/.zshrc" -ef zsh/.zshrc
          test "$HOME/.config/mise/config.toml" -ef mise/config.toml
          test "$HOME/Library/Application Support/Code/User/settings.json" -ef vscode/settings.json
          test ! -e "$HOME/update.sh"
          test "$(git config --get-all include.path)" = '~/.gitconfig_shared'
          test "$(git config --get alias.br)" = branch
          test "$(git config --get core.editor)" = nano
          test "$(git config --global user.name)" = 'Existing User'
      - name: Verify snapshot saving and rollback
        run: python3 tests/test_snapshot.py
